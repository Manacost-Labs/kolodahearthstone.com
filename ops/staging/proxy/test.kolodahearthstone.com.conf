map $server_addr $khs_staging_proxy_region {
    default ru-moscow;
    186.246.28.244 ru-novosibirsk;
}

upstream khs_staging_origin {
    zone khs_staging_origin 64k;
    server 127.0.0.1:18443 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:18444 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:18445 max_fails=1 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.kolodahearthstone.com www.test.kolodahearthstone.com;
    return 301 https://test.kolodahearthstone.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.test.kolodahearthstone.com;
    ssl_certificate /etc/nginx/ssl/test.kolodahearthstone.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/test.kolodahearthstone.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://test.kolodahearthstone.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.kolodahearthstone.com;

    ssl_certificate /etc/nginx/ssl/test.kolodahearthstone.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/test.kolodahearthstone.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:khs_staging_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    auth_basic "KolodaHearthstone staging";
    auth_basic_user_file /etc/nginx/auth/test.kolodahearthstone.com.htpasswd;

    add_header X-Proxy-Region $khs_staging_proxy_region always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/test.kolodahearthstone.com.access.log combined buffer=128k flush=5s;
    error_log /var/log/nginx/test.kolodahearthstone.com.error.log warn;

    location = /_proxy_health {
        auth_basic off;
        access_log off;
        add_header X-Proxy-Region $khs_staging_proxy_region always;
        return 200 "ok $khs_staging_proxy_region koloda staging\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass https://khs_staging_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name test.kolodahearthstone.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_set_header Host test.kolodahearthstone.com;
        proxy_set_header X-Forwarded-Proto http;
        proxy_no_cache 1;
    }

    location / {
        proxy_pass https://khs_staging_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host test.kolodahearthstone.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_name test.kolodahearthstone.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
