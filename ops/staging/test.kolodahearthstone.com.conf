server {
    listen 151.80.21.140:80;
    listen [2001:41d0:c:c8c::]:80;
    server_name test.kolodahearthstone.com www.test.kolodahearthstone.com;
    return 301 https://test.kolodahearthstone.com$request_uri;
}

server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    http2 on;
    server_name www.test.kolodahearthstone.com;
    ssl_certificate /etc/letsencrypt/live/test.kolodahearthstone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.kolodahearthstone.com/privkey.pem;
    return 301 https://test.kolodahearthstone.com$request_uri;
}

server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    http2 on;
    server_name test.kolodahearthstone.com;

    ssl_certificate /etc/letsencrypt/live/test.kolodahearthstone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.kolodahearthstone.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/certs/dhparam4096.pem;

    root /var/www/koloda/data/www/test.kolodahearthstone.com;
    index index.php index.html;
    charset off;
    disable_symlinks if_not_owner from=$document_root;

    auth_basic "KolodaHearthstone staging";
    auth_basic_user_file /etc/nginx/auth/test.kolodahearthstone.com.htpasswd;

    access_log /var/www/httpd-logs/test.kolodahearthstone.com.access.log;
    error_log /var/www/httpd-logs/test.kolodahearthstone.com.error.log notice;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Cache-Control "private, no-store" always;

    if (-f $document_root/.staging-refresh) {
        return 503;
    }

    location = /_proxy_health {
        auth_basic off;
        access_log off;
        return 200 "ok origin kolodahearthstone staging\n";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /views/hit { return 204; }
    location = /mca/event { return 204; }
    location = /mca/script.js {
        default_type application/javascript;
        return 200 "/* analytics disabled on staging */\n";
    }

    location ~* \.(?:css|js|mjs|svg|woff2?|ttf|otf|eot|avif|webp|jpe?g|gif|png|ico|mp4|webm)$ {
        expires 1h;
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }

    location = /wp-config.php { return 404; }
    location = /wp-config-sample.php { return 404; }
    location = /readme.html { return 404; }
    location = /license.txt { return 404; }
    location ~* (?:^|/)(?:\.env(?:\..*)?|\.git(?:/|$)|debug\.log|(?:backup|dump|database|db)\.sql)$ { return 404; }
    location ~* \.(?:bak|backup|old|orig|save|swp|sql|7z|zip|tar|tgz|gz|rar)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ [^/]\.ph(?:p\d*|tml)$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param PHP_ADMIN_VALUE "sendmail_path = /bin/false";
        fastcgi_pass unix:/var/www/php-fpm/1.sock;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;
    }

    client_max_body_size 1100m;
    client_body_timeout 600s;
    gzip on;
    gzip_comp_level 3;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
}
