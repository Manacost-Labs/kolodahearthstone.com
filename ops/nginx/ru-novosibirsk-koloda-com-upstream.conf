# Production koloda_com_origin upstream on the Novosibirsk edge only.
# Replace only the upstream block in /etc/nginx/conf.d/60-kolodahearthstone-com.conf.
# The direct TLS connection avoids congestion on the shared reverse SSH tunnels.
# Keep the tunnels as backups. Validate with nginx -t before reloading.
# Rollback: restore the saved pre-change file, validate, and reload Nginx.
upstream koloda_com_origin {
    zone koloda_com_origin 64k;
    server 151.80.21.140:443 max_fails=2 fail_timeout=2s;
    server 127.0.0.1:18443 max_fails=1 fail_timeout=5s backup;
    server 127.0.0.1:18444 max_fails=1 fail_timeout=5s backup;
    server 127.0.0.1:18445 max_fails=1 fail_timeout=5s backup;
    keepalive 64;
}
