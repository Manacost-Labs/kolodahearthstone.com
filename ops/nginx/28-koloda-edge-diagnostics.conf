# No query strings, cookies, referrers, or article contents in this log.
map $http_x_request_id $koloda_trace_id {
    default $request_id;
    "~^[a-f0-9]{32}$" $http_x_request_id;
}
map $request_uri $koloda_request_path {
    default $uri;
    ~^(?<koloda_path_without_args>[^?]*) $koloda_path_without_args;
}
log_format koloda_diagnostics escape=json
    '{"time":"$time_iso8601","id":"$request_id",'
    '"method":"$request_method","path":"$koloda_request_path","status":$status,'
    '"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"request_bytes":$request_length,"finished_at":$msec,'
    '"upstream":"$upstream_addr","connect":"$upstream_connect_time",'
    '"header":"$upstream_header_time","response":"$upstream_response_time",'
    '"upstream_bytes":"$upstream_bytes_received","cache":"$upstream_cache_status"}';

map $uri $koloda_admin_transfer {
 default 0;
 ~^/(?:wp-admin/|wp-login\.php|wp-json/) 1;
}
map "$koloda_admin_transfer:$http_accept_encoding" $koloda_origin_encoding {
 default "";
 ~*^1:.*gzip gzip;
}
